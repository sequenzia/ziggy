[project]
name = "ziggy"
version = "0.1.0.dev0"
description = "Local execution, orchestration, and audit harness for ACP-speaking AI coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Ada" }]
dependencies = [
    "agent-client-protocol==0.11.1",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-ulid>=2.6",
]

[project.scripts]
ziggy = "ziggy.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ziggy"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires real agent adapters and provider accounts (deselected by default)",
    "slow: spawns real subprocess fixtures; slower than pure-unit tests",
]
addopts = "-m 'not live'"

[tool.uv]
package = true
