[project]
name = "ziggy"
dynamic = ["version"]
description = "Local execution, orchestration, and audit harness for ACP-speaking AI coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Ada" }]
dependencies = [
    "agent-client-protocol==0.11.1",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-ulid>=2.6",
]

[project.scripts]
ziggy = "ziggy.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Git tags (vX.Y.Z) are the single source of truth for the version. Tagged
# commits build as X.Y.Z; anything past a tag gets a PEP 440 dev version like
# 0.1.1.dev3+g1a2b3c4. The fallback only applies to treeless builds (e.g. a
# GitHub source tarball without .git).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ziggy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ziggy"]

# Ship the versioned JSON Schema artifacts (REQ-005) as wheel package data so
# `result.json` / `events.jsonl` can be validated against a pinned schema
# without importing Ziggy. Regenerate with `ziggy schemas dump`.
[tool.hatch.build.targets.wheel.force-include]
"src/ziggy/schemas/result.v1.json" = "ziggy/schemas/result.v1.json"
"src/ziggy/schemas/events.v1.json" = "ziggy/schemas/events.v1.json"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires real agent adapters and provider accounts (deselected by default)",
    "slow: spawns real subprocess fixtures; slower than pure-unit tests",
]
addopts = "-m 'not live'"

[tool.uv]
package = true
